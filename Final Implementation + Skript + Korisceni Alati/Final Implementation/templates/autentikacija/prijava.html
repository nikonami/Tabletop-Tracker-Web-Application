<!-- Opis: Stranica za prijavu korisnika na Tabletop Tracker. -->
{% load static %}
<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Tabletop Tracker - Prijava</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
            margin: 20px;
        }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .error-msg {
            color: #d9534f;
            font-size: 0.85em;
            margin-bottom: 15px;
            border: 1px solid #d9534f;
            padding: 8px;
            border-radius: 3px;
            background: #fff5f5;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        .register-link { margin-top: 15px; text-align: center; font-size: 14px; color: #606770; }
        .register-link a { color: #1877f2; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Prijava</h2>

    {% if greska %}
    <div class="error-msg">{{ greska }}</div>
    {% endif %}

    <form method="POST" action="{% url 'prijava' %}">
        {% csrf_token %}

        <label for="korisnicko_ime">Korisničko ime</label>
        <input type="text" id="korisnicko_ime" name="korisnicko_ime" required maxlength="30">

        <label for="lozinka">Lozinka</label>
        <input type="password" id="lozinka" name="lozinka" required>

        <button type="submit">Prijavi se</button>
    </form>

    <div class="register-link">
        Nemaš nalog? <a href="{% url 'registracija' %}">Registruj se</a>
    </div>
</div>

</body>
</html>
